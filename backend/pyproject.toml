[project]
name = "sa-backend"
version = "0.1.0"
description = "Seafarer Compliance Assistant: database models, matching, notifications and HTTP API"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2",
  "pydantic-settings>=2",
  "email-validator>=2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pyjwt>=2.8",
  "httpx>=0.27",
  "structlog>=24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pgserver>=0.1.4"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sa_backend*"]
