[project]
name = "sa-scraper"
version = "0.1.0"
description = "Seafarer Compliance Assistant: DGMA source monitoring and document pipeline"
requires-python = ">=3.12"
dependencies = [
  "sa-backend",
  "httpx>=0.27",
  "selectolax>=1.0",
  "pyyaml>=6",
  "pdfplumber>=0.11",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3"]
dev = ["pytest>=8", "pytest-cov>=5", "respx>=0.21", "ruff>=0.6"]

[project.scripts]
sa-scraper = "sa_scraper.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sa_scraper*"]

[tool.setuptools.package-data]
sa_scraper = ["rules/*.yaml"]
