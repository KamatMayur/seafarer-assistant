    offshore:  {title: ['\boffshore\b', '\bOSVs?\b', '\bMODUs?\b', 'dynamic positioning', '\bDPO\b']}
    passenger: {title: ['passenger (ships?|vessels?)', '\bcruise', '\bferr(y|ies)\b', 'ro-?pax']}
