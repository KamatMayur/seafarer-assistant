# Rules for classifying and tagging DGMA documents without an LLM.
#
# Every pattern is a Python regex, matched case-insensitively. Use (?-i:...) for case-sensitive tokens (AB, OS).
# For each tag value:
#   title: patterns checked against the title (one hit is enough)
#   body:  patterns checked against the PDF text (default: same as title); need `min_body_hits` total matches
# Body text is only used when the document's text policy allows it.

min_body_hits: 2
review_threshold: 0.65    # below this the document is held for admin review (all unknown doc types are)

# Site "Type" column / year-list type -> doc_type. Checked first.
site_types:
  "DGS Circulars": circular
  "DGS Orders": order
  "MS Notices": notice
  "Advisory": advisory
  "Exam Schedule and Notices": exam_schedule
  "Exam Results": result
  "COC Dispatch List": notice
  "Acts & Rules": rules
  "MMD Circular/Notice/Order": notice
  "General Letters": notice

# Title rules override the site type when they are more specific. First match wins.
doc_type_title_rules:
  - {type: result,        pattern: '\bresults?\b(?! in)|\bpass(ed)? list'}
  - {type: exam_schedule, pattern: 'seat booking|exam(ination)?s?\b.{0,40}\b(schedule|time ?table|date|notice|calendar)|signal (exam|notice)|\b(written|oral|function) (exam|examination)|notice (to|for)\b.{0,40}\bcandidates'}
  - {type: advisory,      pattern: '\badvisory\b|\bpiracy\b|armed robbery|security alert|best management practices'}
  - {type: order,         pattern: '^\s*(dgs|dgma) order\b|\border no\b'}
  - {type: notice,        pattern: 'dispatch list|speed post'}
  - {type: exam_schedule, pattern: '\bexaminations?\b|\bexams?\b'}
  - {type: notice,        pattern: '^\s*notice\b'}

# Site types / titles that are about the Directorate's own administration, not seafarers. No alerts.
internal:
  site_types: ["Vacancy", "Tenders", "Office Order", "Annual Report", "Budget Manual", "Quality Management System", "User Manual"]
  title: ['\bvacanc(y|ies)\b', '\bdeputation\b', '\btenders?\b', '\bGeM\b', '\bprocurement\b', 'e-?auction', '\bquotations?\b',
          '\bRTI\b', 'hindi (pakhwada|fortnight|diwas)', 'official language', '\bswachh', 'vigilance awareness',
          'transfers? (and|&) postings?', '\bempanelment\b', 'recruitment (rules )?(to|for|of) the post', '\bpension(ers)?\b',
          'annual property return']

# Documents with none of the seafarer indicators but some of these are for shipowners/ports/institutes.
industry:
  title: ['port facilit', 'ship ?owners?', 'shipping compan', 'recogni[sz]ed organi[sz]ation', 'classification societ',
          'ballast water', 'ship recycling', '\bcargo\b', 'tonnage', 'registration of (indian )?ships', 'ship registr',
          '\bMTO\b', 'multimodal', 'shipbuild', 'port state control', '\bsurvey(s|ors?)?\b', '\bMTIs?\b', 'maritime training institut']

# Documents of these types are for seafarers unless they are internal.
seafarer_doc_types: [exam_schedule, result, advisory]
seafarer_site_types: ["COC Dispatch List", "Exam Results", "Exam Schedule and Notices", "Advisory"]

seafarer_indicators:
  title: ['lifeboat', 'life-?saving', '\bLSA\b', '\bFFA\b', 'safety (alert|bulletin|video|campaign)', '\baccident', 'enclosed space',
          'sagar mein', '\bGMDSS\b', 'speed post', 'approved doctors', 'medical examiners?', 'unclaimed', '\bfraud', '\bfake\b', 'seafar', '\bcrew', '\bCoCs?\b', '\bCoPs?\b', '\bCDCs?\b', '\bBSID\b', '\bINDoS\b', 'candidates?', 'cadets?',
          '\bratings?\b', '\bofficers?\b', '\bexam', '\bcourses?\b', 'sign[- ]?(on|off)', 'medical fitness', '\bSTCW\b',
          'watchkeep', 'sea service', '\bMMDs?\b', 'e-?samu?n?dra', 'e-?navik', '\bRPSL?\b', 'manning agenc', 'recruitment and placement',
          'piracy', 'security of (indian )?seafarers', '\bmasters?\b', '\bmates?\b', '\bMEO\b', '\bETOs?\b', 'certificate of competency',
          'continuous discharge', 'dispatch list', 'endorsement', 'revalidat', 'preparatory course', 'model course']

critical:
  # A document is critical when it is an advisory AND one of these match the title (or a source hints critical).
  title: ['piracy', 'armed robbery', 'security', 'high risk area', '\bHRA\b', 'conflict', '\bwar\b', 'attack', 'missile', 'drone',
          'hostilit', 'red sea', 'hormuz', 'gulf of aden', 'persian gulf', 'evacuat', 'safety of (indian )?seafarers']

relations:
  title: '\b(addendum|corrigendum|amendment|supersession|supersedes|modification|in continuation|revised|clarification)\b'
  # Checked in the first 2000 characters of the PDF text; only unambiguous wording.
  body: '\b(supersession|supersedes|addendum|corrigendum|in partial modification|in continuation)\b'
  reference: '\b(?:circular|notice|order)\s*(?:no\.?\s*)?(\d{1,3})\s*of\s*(\d{4})'

